# Configuration for model backward compatibility testing

# Knowledge Base
knowledge_base_id: "your-kb-id"
region: "us-east-1"

# Models
baseline_model_arn: "arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-20250514"
candidate_model_arn: "arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-20250514"
embedding_model_id: "amazon.titan-embed-text-v2:0"

# Test queries
test_queries:
  - "What does comprehensive coverage include?"
  - "How do I file a claim after an accident?"
  - "What is the standard deductible for collision coverage?"
  - "Are rental cars covered under my policy?"
  - "What exclusions apply to flood damage?"

# Scoring weights (must sum to 1.0)
weights:
  semantic: 0.40
  structural: 0.10
  factual: 0.50

# Thresholds
drift_threshold: 0.85
significance_level: 0.05

# Sampling
repetitions: 10

# CloudWatch
cloudwatch_namespace: "RAG/DriftDetection"
